<title>ردود الورث</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Tajawal:wght@800&display=swap">
<style>
/* layout: single mobile column, sticky category chips, tap-to-copy rows */
:root{--bg:#F3F4F8;--card:#FFFFFF;--fg:#1B1E2B;--muted:#6A6F85;--line:#E1E3EC;--accent:#F2A900;--accentfg:#1B1E2B;--ok:#1F9D55;--okbg:#E5F6EC;
--display:"Tajawal","IBM Plex Sans Arabic",system-ui,sans-serif;--body:"IBM Plex Sans Arabic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10121A;--card:#1A1D29;--fg:#ECEDF3;--muted:#9A9FB5;--line:#2A2E3E;--accent:#F5B82E;--accentfg:#10121A;--ok:#4ADE80;--okbg:#14301F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10121A;--card:#1A1D29;--fg:#ECEDF3;--muted:#9A9FB5;--line:#2A2E3E;--accent:#F5B82E;--accentfg:#10121A;--ok:#4ADE80;--okbg:#14301F;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1{font-family:var(--display);font-size:1.9rem;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 14px;line-height:1.6}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:5;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.bar a{flex:none;text-decoration:none;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.85rem;white-space:nowrap}
.prog{font-size:.85rem;color:var(--muted);margin:6px 0 0;font-variant-numeric:tabular-nums}
.prog button{font:inherit;color:var(--muted);background:none;border:0;text-decoration:underline;cursor:pointer;padding:0 6px}
section{margin-top:22px;scroll-margin-top:60px}
h2{font-family:var(--display);font-size:1.15rem;margin:0 0 10px;display:flex;gap:8px;align-items:center}
h2 span{font-family:var(--body);font-size:.8rem;color:var(--muted);font-weight:400}
ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
li .n{color:var(--muted);font-size:.8rem;min-width:2.2em;font-variant-numeric:tabular-nums}
li p{margin:0;flex:1;min-width:0;line-height:1.6;user-select:all}
li button{flex:none;font:600 .85rem var(--body);background:var(--accent);color:var(--accentfg);border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
li button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
li.done{background:var(--okbg)}
li.done button{background:var(--ok);color:var(--card)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
<div class="wrap">
<h1>ردود «الورث»</h1>
<p class="sub">100 رد لفيديو «الورث»: 40 لاختيار A و40 لاختيار B و20 عامة وعاطفية. اضغط «نسخ» والصقه كرد، والرد اللي نسخته يصير أخضر عشان ما تكرره. في إنستقرام رد كل دقيقة تقريباً عشان ما يوقف ردودك.</p>
<nav class="bar" id="bar"></nav>
<p class="prog" id="prog"></p>
<div id="list"></div>
</div>
<div class="toast" id="toast">تم النسخ ✅</div>
<script>
const DATA=[{"id": "a", "title": "اختاروا A: يعلّمهم ويقسم", "items": ["الإخوان أغلى من أي بيت 🤍", "البيت يروح ويجي، بس الأخوّة ما تتعوّض 💯", "قلبك أبيض الله يحفظك 🤲", "الرزق اللي فيه قطيعة ما فيه بركة 🙏", "وش فايدة ثلاثة ملايين وإخوانك زعلانين؟ 💔", "رجّال والله 👏", "أخوك غرقان وأختك بالإيجار… A بدون تفكير 🤍", "العدل بين الإخوان يرضي الله 🤲", "أبوك الله يرحمه أكيد يبي إخوانك مرتاحين 🤍", "البركة في القسمة 🌿", "هذا اللي تربّينا عليه 👏", "ولد أصول 💯", "الله يرحم أبوك ويجمعكم على خير 🤲", "البيت بيت الكل 🏠🤍", "قرار يرفع الراس 👑", "تخيّل أختك وعيالها بالإيجار وأنت ساكن بثلاثة ملايين 😢 A أكيد", "الدنيا فانية والإخوان باقين 🤍", "A وأنت مرتاح الضمير 😌", "الله يجزاك خير على هالنية 🙏", "كثير اختاروا A وهذا يفرّح القلب 🤍", "المال يفرّق والقلب يجمع ❤️", "أحسن قرار ممكن تسويه 💯", "الإخوان سند، لا تخسرهم 🤝", "والله إنها تستاهل، خلّ أخوك يسدد ديونه 🙏", "ما في أغلى من لمّة الإخوان 🤍", "الله يكثر من أمثالك 👏", "A لأن السر ما يدوم، ويوم يعرفون بيكون أصعب 👀", "تقسمه وتنام مرتاح 😴🤍", "هذي الشهامة 💪", "أبوك أعطاك أمانة، وأنت عدلت فيها 🤍", "الله يبارك لك في نصيبك 🤲", "فزعتك لأختك وعيالها ما تنسى 🥺", "صلة الرحم أعظم من أي صك 🤍", "قلب كبير 👏", "لو كنت مكانك نفس الشي A 💯", "البيت حجر، والإخوان روح 🤍", "قسمة العدل تريّح الكل ⚖️", "الله يرضى عليك 🤲", "A وربي يعوضك خير 🌿", "كذا يكون الكبير 👑"]}, {"id": "b", "title": "اختاروا B: يسكت وياخذه", "items": ["رغبة الأب لازم تنحترم 🤍", "أبوك عنده أسبابه أكيد 🤔", "الصك نظامي ومحد له حق 💯", "يمكن أبوك يعرف شي ما تعرفه 👀", "B بس ساعد أختك بطريقة ثانية 🤍", "تحترم كلامه وتسكت 🤐", "أبوك اختارك أنت، أكيد فيه سبب 👌", "ما تخالف كلام أبوك وهو ميت 🙏", "صعب بس منطقي 💯", "تقدر تسكن أختك عندك بدون ما تقسم 🤔", "الورقة واضحة: لا تعلّم إخوانك 🤐", "وفاء لأبوك 🤍", "B وتساعد أخوك بديونه من جيبك بدون ما تعلّمه 👌", "أبوك يعرف عياله زين 👀", "عقلك صاحي 🧠", "لو أبوك بغى يقسمه كان قسمه 🤷", "تحترم وصيته وتدعي له 🤲", "ما أحد يقدر يلومك 💯", "يمكن أخوك بيضيعها بالديون 😬", "B وتكون سند لإخوانك بطريقتك 🤍", "قرار صعب بس تحترم أبوك 👏", "الأب ما يسوي شي بدون سبب 🤔", "تاخذه وتخلّي بابك مفتوح لهم 🚪🤍", "ثقة أبوك فيك أمانة 🔒", "واضح إنك كنت أقرب واحد له 🥺", "B عشان ما تخون ثقته 🤐", "اللي كتبه أبوك هو الكلمة الأخيرة 📜", "وش يضمن إن الإخوان ما يبيعونه؟ 🤔 B", "تحفظ البيت للعيلة كلها بطريقتك 🏠", "فاهمها صح 👌", "ما في أحد ملزوم يخالف رغبة أبوه 💯", "تسكت وتدعي له بالرحمة 🤲", "أحترم رأيك 👏", "يمكن أبوك تعب من إخوانك وأنت تدري 👀", "B بس قلبي مع أختك وعيالها 💔", "حق نظامي ورغبة أب… B منطقي 🏛️", "الصك صك 📜", "قرار ناضج 👌", "تشيل الأمانة وتسكت 🤍", "معك، كلام الأب ما ينكسر 🙏"]}, {"id": "e", "title": "ردود عامة وعاطفية وتفاعل", "items": ["سؤال صعب صح؟ 😅", "والله إن القرار يوجع 💔", "الله يرحم أبوك وأبوينا جميعاً 🤲", "كل الاحترام للي اختار A وللي اختار B 🤍", "لو كان عندك إخوان وش بتسوي؟ 👀", "منشن أخوك وشوف وش يختار 👀", "جوابك يقول كثير عنك 👀", "وش تتوقع سبب أبوه؟ 🤔", "مين عنده قصة مشابهة؟ 🥺", "الورث فرّق عيال كثير، الله يكفينا 🤲", "تعليقك فخم 👏", "نورت 🤍", "حقك تحتار، القرار صعب 😅", "C؟ قول لنا وش هو 😄", "تابعنا للقرار الجاي 🔥", "ريّحت قلبي بتعليقك 🤍", "الله يجمع شمل كل الإخوان 🤍", "والله إن هالقصص تصير كثير 💯", "أرسلها لأحد عنده إخوان 🔁", "شكراً إنك شاركتنا رأيك 🙏"]}];
let used={};try{used=JSON.parse(localStorage.getItem("used9")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("used9",JSON.stringify(used))}catch(e){}};
const bar=document.getElementById("bar"),list=document.getElementById("list"),prog=document.getElementById("prog"),toast=document.getElementById("toast");
let n=0;const total=DATA.reduce((a,c)=>a+c.items.length,0);
DATA.forEach(c=>{const a=document.createElement("a");a.href="#"+c.id;a.textContent=c.title.split(":")[0].split("(")[0].trim();bar.appendChild(a);
const s=document.createElement("section");s.id=c.id;s.innerHTML="<h2>"+c.title+" <span>"+c.items.length+" رد</span></h2>";const ol=document.createElement("ol");
c.items.forEach(t=>{n++;const key=c.id+":"+t;const li=document.createElement("li");if(used[key])li.classList.add("done");
const num=document.createElement("span");num.className="n";num.textContent=n;const p=document.createElement("p");p.textContent=t;
const b=document.createElement("button");b.type="button";b.textContent=used[key]?"تم ✓":"نسخ";
b.addEventListener("click",()=>{const ok=()=>{used[key]=1;save();li.classList.add("done");b.textContent="تم ✓";show("تم النسخ ✅");upd()};
const sel=()=>{const r=document.createRange();r.selectNodeContents(p);const g=getSelection();g.removeAllRanges();g.addRange(r);try{document.execCommand("copy");ok()}catch(e){show("النص محدد، انسخه يدوياً")}};
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,sel)}else sel()});
li.append(num,p,b);ol.appendChild(li)});s.appendChild(ol);list.appendChild(s)});
function upd(){const u=Object.keys(used).length;prog.innerHTML="استخدمت "+u+" من "+total+' <button type="button" id="reset">ابدأ من جديد</button>';document.getElementById("reset").onclick=()=>{used={};save();document.querySelectorAll("li.done").forEach(l=>{l.classList.remove("done");l.querySelector("button").textContent="نسخ"});upd()}}
let tt;function show(m){toast.textContent=m;toast.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove("on"),1400)}
upd();
</script>
