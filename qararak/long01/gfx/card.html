<!doctype html><html dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../engine/fonts/local.css">
<style>
:root{--ink:#0E0F12;--paper:#F4F1EC;--a:#FF5A1F;--b:#22D3EE;--gold:#FFC53D;--mute:#9C9AA3}
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--ink);font-family:Cairo,sans-serif;color:var(--paper)}
.bg{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(38px) brightness(.5) saturate(1.2)}
.grain{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(14,15,18,0) 30%,rgba(14,15,18,.85) 100%)}
.hole{position:absolute;left:656px;top:0;width:608px;height:1080px;background:#000;box-shadow:0 0 0 3px rgba(255,197,61,.55),0 0 80px rgba(0,0,0,.8)}
.side{position:absolute;top:0;height:1080px;width:656px;padding:90px 70px;display:flex;flex-direction:column}
.R{right:0}.L{left:0}
.eyebrow{font-weight:700;font-size:30px;color:var(--gold);letter-spacing:1px}
.pnum{font-weight:900;font-size:150px;line-height:1;margin-top:10px}
.ptitle{font-weight:900;font-size:58px;line-height:1.2;margin-top:18px}
.decs{margin-top:auto;display:flex;flex-direction:column;gap:16px}
.dec{display:flex;align-items:center;gap:16px;font-size:30px;font-weight:700}
.let{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:34px;color:var(--ink)}
.la{background:var(--a)}.lb{background:var(--b)}.lq{background:transparent;border:3px dashed var(--gold);color:var(--gold)}
.track{display:flex;flex-direction:column;gap:26px;margin-top:40px}
.step{display:flex;align-items:center;gap:22px;font-size:34px;font-weight:700;color:var(--mute)}
.dot{width:30px;height:30px;border-radius:50%;border:4px solid var(--mute);flex:none}
.step.done{color:var(--paper)}.step.done .dot{background:var(--paper);border-color:var(--paper)}
.step.cur{color:var(--gold);font-size:42px;font-weight:900}.step.cur .dot{background:var(--gold);border-color:var(--gold);box-shadow:0 0 24px var(--gold);width:38px;height:38px}
.brand{margin-top:auto;display:flex;align-items:center;gap:20px;font-weight:900;font-size:48px}
.brand img{width:96px;height:96px;border-radius:24px}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:20px}
.big{font-weight:900;font-size:120px;line-height:1.1}
.mid{font-weight:800;font-size:60px}
.small{font-weight:700;font-size:38px;color:var(--mute)}
.vote{display:flex;align-items:center;gap:40px;margin:16px 0}
.vote .let{width:200px;height:200px;font-size:130px}
.choice{font-weight:900;font-size:84px;max-width:1100px;line-height:1.2}
.next{margin-top:40px;padding:18px 44px;border-radius:999px;border:3px solid var(--gold);font-size:44px;font-weight:800}
.next b{color:var(--gold)}
.gold{color:var(--gold)}.a{color:var(--a)}.bb{color:var(--b)}
.mascot{width:300px;height:300px;border-radius:60px;box-shadow:0 20px 80px rgba(0,0,0,.6)}
.pills{display:flex;gap:20px;margin-top:10px}.pill{padding:12px 32px;border-radius:999px;background:rgba(244,241,236,.1);font-size:36px;font-weight:700}
</style></head><body><div id="root"></div>
<script>
const P=[
 {n:1,ep:1,t:'المحفظة',v:'A',c:'رجّعت المحفظة'},
 {n:2,ep:3,t:'أنت السارق!',v:'A',c:'فضحته قدام الكل'},
 {n:3,ep:4,t:'القضية',v:'A',c:'كمّلت للمحكمة'},
 {n:4,ep:5,t:'الحكم… والولد',v:'B',c:'خلّه ياخذ جزاه'},
 {n:5,ep:6,t:'العدالة… والولد',v:'?',c:'القرار لك'}];
const q=new URLSearchParams(location.search),mode=q.get('m'),i=+q.get('i');
const L=v=>v=='A'?'la':v=='B'?'lb':'lq';
const root=document.getElementById('root');let h='';
const bg=c=>`<div style="position:absolute;inset:0;overflow:hidden"><div class="bg" style="background-image:url(c${c}.png)"></div></div><div class="grain"></div>`;
if(mode=='frame'){const p=P[i];
 h=bg(p.ep)+`<div class="hole"></div><div class="side R"><div class="eyebrow">قصة المحفظة · الجزء ${p.n} من 5</div><div class="pnum">الجزء ${p.n}</div><div class="ptitle">${p.t}</div>
 <div class="decs">${P.slice(0,i).map(x=>`<div class="dec"><span class="let ${L(x.v)}">${x.v}</span>${x.c}</div>`).join('')}</div></div>
 <div class="side L"><div class="eyebrow">قراراتكم</div><div class="track">${P.map((x,k)=>`<div class="step ${k<i?'done':k==i?'cur':''}"><span class="dot"></span>${x.t}</div>`).join('')}</div>
 <div class="brand"><img src="pfp_logo.png">قرارك</div></div>`}
if(mode=='frame7'){h=bg(7)+`<div class="hole"></div><div class="side R"><div class="eyebrow">قصة جديدة · الجزء 1</div><div class="pnum" style="font-size:110px">جديد</div><div class="ptitle">الحوالة الغلط</div><div class="decs"><div class="dec"><span class="let la">A</span>ترجّعها فوراً</div><div class="dec"><span class="let lb">B</span>عن طريق البنك بس</div></div></div>
 <div class="side L"><div class="eyebrow">صوّت في التعليقات</div><div class="ptitle" style="font-size:52px">قلبك… ولا عقلك؟</div><div class="brand"><img src="pfp_logo.png">قرارك</div></div>`}
if(mode=='bridge'){const p=P[i],nx=P[i+1];
 h=bg(nx.ep)+`<div class="center"><div class="small">نتيجة تصويت الجزء ${p.n}</div><div class="mid">أغلبكم اختار</div>
 <div class="vote"><span class="let ${L(p.v)}">${p.v}</span><div class="choice">${p.c}</div></div>
 <div class="next">التالي: <b>الجزء ${nx.n} · ${nx.t}</b></div></div>`}
if(mode=='intro'){h=bg(1)+`<div class="center"><img class="mascot" src="pfp_mascot.png"><div class="small gold">قرارك · القصة كاملة</div><div class="big">قصة <span class="gold">المحفظة</span></div>
 <div class="mid">50,000 ريال… ومدير ظالم… وولد تحت المطر</div><div class="pills"><span class="pill">5 أجزاء</span><span class="pill">5 قرارات</span><span class="pill">أنتم اخترتوا</span></div></div>`}
if(mode=='final'){h=bg(6)+`<div class="center"><div class="small">آخر قرار في القصة</div><div class="mid">وهالمرة… القرار لك</div>
 <div class="vote" style="gap:60px"><div style="display:flex;align-items:center;gap:24px"><span class="let la" style="width:150px;height:150px;font-size:100px">A</span><div class="choice" style="font-size:60px">تتكفّل فيه</div></div>
 <div style="display:flex;align-items:center;gap:24px"><span class="let lb" style="width:150px;height:150px;font-size:100px">B</span><div class="choice" style="font-size:60px">تمشي</div></div></div>
 <div class="next">اكتب حرفك في <b>التعليقات</b> 👇</div></div>`}
if(mode=='outro'){h=bg(7)+`<div class="center" style="justify-content:flex-start;padding-top:110px"><div class="big" style="font-size:96px">كل أسبوع… <span class="gold">القصة كاملة</span></div>
 <div class="mid">اشترك عشان تعرف وش صار بالحوالة</div></div>
 <div style="position:absolute;bottom:60px;left:0;right:0;text-align:center" class="brand"><div style="margin:0 auto;display:flex;align-items:center;gap:20px"><img src="pfp_logo.png">قرارك</div></div>`}
root.innerHTML=h;
</script></body></html>
