فيه بحيرة وقلوب صغيرة تطفو خلف رأسه دون أن ينتبه", "prompt": "IMAGE REFERENCES: image 1 = the channel mascot character. YouTube thumbnail, 16:9, flat 2D cartoon illustration with thick clean black outlines and flat solid colors on a soft pale yellow background. The man shrugs with open palms and a puzzled half smile while small heart icons float unnoticed behind his head. The man is the exact same character as image 1, drawn large on the right side of the frame, with a clear readable expression. On the left side, huge heavy black condensed uppercase headline text reads exactly \"THEY NEVER TELL YOU\", with the words \"NEVER\" set as white letters on a solid black block. The headline fills almost half of the frame and stays readable at very small size. No other text, no watermark. Bold, simple, high contrast, one clear focal point.", "url": ""}], "vo": "You think you're average. Maybe a little below. You look in the mirror and see everything that's wrong. But here's something strange. You are one of the worst judges of how other people see you. In 2018, researchers had strangers talk for a few minutes, then asked each one, how much did the other person like you? Almost everyone guessed too low. They called it the liking gap. People like you more than you think. And they've been showing you for years. Here are six signs you missed. One. The look, then the look away. You glance up, and someone is already looking. The second your eyes meet, theirs snap away. Researchers call it attention capture. In a 2003 study, people's eyes locked onto attractive faces and had trouble letting go. One look is chance. If it happens again a few seconds later, it isn't. Two. People act a little strange around you. They trip over words. They laugh too hard. Or they go oddly cold, for no reason. You read it as, they don't like me. Often it's the opposite. You make them self-conscious. People are relaxed around those they've put in the friend box. Nerves show up when something is at stake. Three. Strangers do you small favors. The extra scoop. The held door. The \"don't worry about it.\" You think everyone gets that. In 1972, psychologists named it the halo effect. We assume good looking people are also kinder, smarter and more capable. In one experiment, strangers found a lost application form with a photo attached. They mailed it back far more often when the photo was attractive. If the world seems slightly easier on you than on your friends, that's not luck. Four. Nobody compliments your looks. This sounds backwards. But think about it. People compliment what feels safe. Nice shirt. Good haircut. Telling a man he's handsome feels like a confession. And they assume you already know. So everyone stays quiet. Instead you get the indirect version. \"How are you single?\" \"She's lucky.\" \"You don't need to worry.\" Five. People copy you. You lean back. A second later, they lean back. You pick up your drink. So do they. In 1999, researchers called this the chameleon effect. We unconsciously mimic the people we want to be closer to. Test it. Shift your posture in a conversation and count to five. Six. People remember you. The barista knows your order. Someone you met once knows your name. A coworker quotes something you said months ago. The brain doesn't store everyone. It stores who it paid attention to. Now here's the part that matters more than any sign. In 2004, two researchers asked people to rate the looks of others they actually knew. Teammates. Classmates. Coworkers. The ratings barely matched what strangers thought. People who were liked, respected and hard working were seen as physically better looking. Your face is a first impression. Your character redraws it. So the most reliable way to become more attractive isn't a jawline. It's being a man people feel better around. You're not seeing what they see. And most of what they see isn't your face. How many of the six have happened to you? Drop the number below. And next, five silent behaviors that make people regret hurting you.", "words": 549, "dur": 224.28, "srt": "1\n00:00:00,000 --> 00:00:03,200\nYou think you're average. Maybe a little below.\n\n2\n00:00:03,300 --> 00:00:07,320\nYou look in the mirror and see everything that's wrong.\n\n3\n00:00:07,400 --> 00:00:14,240\nBut here's something strange. You are one of the worst judges of how other people see you.\n\n4\n00:00:14,400 --> 00:00:23,160\nIn 2018, researchers had strangers talk for a few minutes, then asked each one, how much did the other person like you?\n\n5\n00:00:23,300 --> 00:00:27,680\nAlmost everyone guessed too low. They called it the liking gap.\n\n6\n00:00:27,800 --> 00:00:35,800\nPeople like you more than you think. And they've been showing you for years. Here are six signs you missed.\n\n7\n00:00:35,900 --> 00:00:38,720\nOne. The look, then the look away.\n\n8\n00:00:38,800 --> 00:00:45,240\nYou glance up, and someone is already looking. The second your eyes meet, theirs snap away.\n\n9\n00:00:45,400 --> 00:00:53,360\nResearchers call it attention capture. In a 2003 study, people's eyes locked onto attractive faces and had trouble letting go.\n\n10\n00:00:53,500 --> 00:00:59,080\nOne look is chance. If it happens again a few seconds later, it isn't.\n\n11\n00:00:59,200 --> 00:01:02,400\nTwo. People act a little strange around you.\n\n12\n00:01:02,500 --> 00:01:08,920\nThey trip over words. They laugh too hard. Or they go oddly cold, for no reason.\n\n13\n00:01:09,000 --> 00:01:15,440\nYou read it as, they don't like me. Often it's the opposite. You make them self-conscious.\n\n14\n00:01:15,600 --> 00:01:23,160\nPeople are relaxed around those they've put in the friend box. Nerves show up when something is at stake.\n\n15\n00:01:23,300 --> 00:01:25,680\nThree. Strangers do you small favors.\n\n16\n00:01:25,800 --> 00:01:32,200\nThe extra scoop. The held door. The \"don't worry about it.\" You think everyone gets that.\n\n17\n00:01:32,300 --> 00:01:40,320\nIn 1972, psychologists named it the halo effect. We assume good looking people are also kinder, smarter and more capable.\n\n18\n00:01:40,400 --> 00:01:50,440\nIn one experiment, strangers found a lost application form with a photo attached. They mailed it back far more often when the photo was attractive.\n\n19\n00:01:50,600 --> 00:01:56,560\nIf the world seems slightly easier on you than on your friends, that's not luck.\n\n20\n00:01:56,700 --> 00:01:58,680\nFour. Nobody compliments your looks.\n\n21\n00:01:58,800 --> 00:02:01,600\nThis sounds backwards. But think about it.\n\n22\n00:02:01,700 --> 00:02:08,920\nPeople compliment what feels safe. Nice shirt. Good haircut. Telling a man he's handsome feels like a confession.\n\n23\n00:02:09,000 --> 00:02:13,040\nAnd they assume you already know. So everyone stays quiet.\n\n24\n00:02:13,200 --> 00:02:19,960\nInstead you get the indirect version. \"How are you single?\" \"She's lucky.\" \"You don't need to worry.\"\n\n25\n00:02:20,100 --> 00:02:21,680\nFive. People copy you.\n\n26\n00:02:21,800 --> 00:02:28,600\nYou lean back. A second later, they lean back. You pick up your drink. So do they.\n\n27\n00:02:28,700 --> 00:02:36,320\nIn 1999, researchers called this the chameleon effect. We unconsciously mimic the people we want to be closer to.\n\n28\n00:02:36,400 --> 00:02:41,240\nTest it. Shift your posture in a conversation and count to five.\n\n29\n00:02:41,400 --> 00:02:42,960\nSix. People remember you.\n\n30\n00:02:43,100 --> 00:02:51,080\nThe barista knows your order. Someone you met once knows your name. A coworker quotes something you said months ago.\n\n31\n00:02:51,200 --> 00:02:56,000\nThe brain doesn't store everyone. It stores who it paid attention to.\n\n32\n00:02:56,100 --> 00:03:00,120\nNow here's the part that matters more than any sign.\n\n33\n00:03:00,200 --> 00:03:07,440\nIn 2004, two researchers asked people to rate the looks of others they actually knew. Teammates. Classmates. Coworkers.\n\n34\n00:03:07,600 --> 00:03:15,960\nThe ratings barely matched what strangers thought. People who were liked, respected and hard working were seen as physically better looking.\n\n35\n00:03:16,100 --> 00:03:20,080\nYour face is a first impression. Your character redraws it.\n\n36\n00:03:20,200 --> 00:03:28,200\nSo the most reliable way to become more attractive isn't a jawline. It's being a man people feel better around.\n\n37\n00:03:28,300 --> 00:03:34,320\nYou're not seeing what they see. And most of what they see isn't your face.\n\n38\n00:03:34,400 --> 00:03:39,640\nHow many of the six have happened to you? Drop the number below.\n\n39\n00:03:39,800 --> 00:03:44,160\nAnd next, five silent behaviors that make people regret hurting you.\n\n", "scenes": [{"n": 1, "st": 0.0, "f": "H", "sec": "Hook", "vo": "You think you're average. Maybe a little below.", "ar": "البطل ينظر لنفسه في مرآة الحمام بوجه غير راضٍ", "p": "The man looks at himself in a bathroom mirror with a flat unimpressed face. Close shot over the shoulder. Cold bathroom light, doubtful mood. The man is the exact character from the reference image, shown only once. Flat 2D cartoon illustration, thick clean black outlines, flat solid colors, minimal background on warm off white, burnt orange as the only accent color, simple shapes, clean uncluttered composition.", "a": "Animate this still image with simple motion that fits the scene. The man looks at himself in a bathroom mirror with a flat unimpressed face. Close shot over the shoulder. Cold bathroom light, doubtful mood. Keep the exact same character and drawing style as the input image. Smooth flat 2D cartoon motion only, no morphing, no new characters, no text. Slow subtle camera push in. Duration 5 seconds."}, {"n": 2, "st": 3.3, "f": "H", "sec": "Hook", "vo": "You look in the mirror and see everything that's wrong.", "ar": "البطل يقترب من المرآة ودوائر حمراء تظهر حول أنفه وشعره وفكه", "p": "The man leans close to the mirror as small red circles appear around his nose, hairline and artoon illustration, thick clean black outlines, flat solid colors, minimal background on warm off white, burnt orange as the only accent color, simple shapes, clean uncluttered composition.", "a": ""}]}, {"id": "07", "titles": ["5 Silent Behaviors That Make People Regret Hurting You", "Don't Get Revenge. Do These 5 Quiet Things Instead (Psychology)", "What Calm Men Do After Someone Hurts Them"], "pick": "النموذج 1 مطابق لصيغة فيديو حقق 469 ألف مشاهدة، ونسخة أخرى منه حققت 200 ألف عند قناة فيها 6.6 ألف مشترك. الرقم والكلمتان Silent و Regret هي ما يصنع الضغطة.", "animal": "5 Silent Behaviors That Make People Regret Hurting You|🤫", "desc": "5 Silent Behaviors That Make People Regret Hurting You\n\nSomeone hurt you, and part of you wants them to feel it. So you plan the message, the comeback, the post they are meant to see. Psychology says almost all of it backfires. This video covers five silent behaviors that actually change how people remember what they did to you, and the one trap that turns silence into something ugly.\n\n📌 WHAT YOU'LL LEARN:\n✓ Why getting even makes you feel worse, not better\n✓ What hitting a punching bag does to anger\n✓ Why the person who explains the most loses\n✓ The difference between going cold and going quiet\n✓ Why unfinished stories stay in the mind\n✓ The trap: silence as punishment\n\n⏱️ CHAPTERS:\n0:00 Intro\n0:33 No Reaction\n1:10 No Explaining\n1:31 Change Access\n1:56 Get Better\n2:22 No Return\n2:54 The Trap\n3:17 Close\n\n🧠 THE SCIENCE:\nCarlsmith, Wilson and Gilbert (2008) found that people who punished someone who wronged them kept thinking about that person and felt worse than people who had no chance to retaliate. Bushman (2002) found that venting anger on a punching bag made people angrier and more aggressive, not calmer. Zeigarnik (1927) showed that unfinished tasks stay in memory longer than finished ones. Williams (2007) reviewed how being deliberately ignored registers as real pain, which is why silence should never be used as a weapon.\n\n💡 KEY TAKEAWAY:\nYou cannot make someone regret you. You can only become someone worth regretting.\n\n📚 RESEARCH MENTIONED:\n• Carlsmith, K. M., Wilson, T. D., & Gilbert, D. T. (2008). The paradoxical consequences of revenge. Journal of Personality and Social Psychology.\n• Bushman, B. J. (2002). Does venting anger feed or extinguish the flame? Personality and Social Psychology Bulletin.\n• Zeigarnik, B. (1927). On finished and unfinished tasks. Psychologische Forschung.\n• Williams, K. D. (2007). Ostracism. Annual Review of Psychology.\n• Eisenberger, N. I., Lieberman, M. D., & Williams, K. D. (2003). Does rejection hurt? An fMRI study of social exclusion. Science.\n\nThis video is for education and self-reflection. It is not therapy or relationship counseling.\n\n🔔 Subscribe to Unchased for the psychology of men who stopped chasing.\n\n#Psychology #SelfRespect #MensPsychology #SilentPower #EmotionalControl #HumanBehavior #Unchased", "tags": "silent behaviors that make people regret hurting you, make them regret losing you, what to do when someone hurts you, silent revenge psychology, best revenge is no revenge, self respect, emotional control, stop explaining yourself, psychology of silence, male psychology, moving on psychology, psychology explained, unchased", "thumbs": [{"k": "A", "overlay": "MAKE THEM REGRET IT", "accent": "REGRET", "en": "The man walks calmly toward the right with a small content smile, while far behind him a small cartoon figure stands frozen holding a phone and staring after him with wide worried eyes.", "ar": "البطل يمشي بهدوء وابتسامة خفيفة وخلفه شخص صغير متجمد يحدق فيه بقلق", "prompt": "IMAGE REFERENCES: image 1 = the channel mascot character. YouTube thumbnail, 16:9, flat 2D cartoon illustration with thick clean black outlines and flat solid colors on a pure white background. The man walks calmly toward the right with a small content smile, while far behind him a small cartoon figure stands frozen holding a phone and staring after him with wide worried eyes. The man is the exact same character as image 1, drawn large on the right side of the frame, with a clear readable expression. On the left side, huge heavy black condensed uppercase headline text reads exactly \"MAKE THEM REGRET IT\", with the words \"REGRET\" set as white letters on a solid burnt orange block. The headline fills almost half of the frame and stays readable at very small size. No other text, no watermark. Bold, simple, high contrast, one clear focal point.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3LvxZ95GNv9hPk8ex4RElfiPNA4/hf_20261111_211906_982da3d4-8dad-43bb-a3aa-cd961646a8ef.png"}, {"k": "B", "overlay": "5 SILENT MOVES", "accent": "SILENT", "en": "The man holds one finger to his lips in a quiet gesture and looks straight at the viewer with calm half closed eyes.", "ar": "البطل يضع إصبعه على شفتيه وينظر للمشاهد بعينين هادئتين", "prompt": "IMAGE REFERENCES: image 1 = the channel mascot character. YouTube thumbnail, 16:9, flat 2D cartoon illustration with thick clean black outlines and flat solid colors on a warm off white background. The man holds one finger to his lips in a quiet gesture and looks straight at the viewer with calm half closed eyes. The man is the exact same character as image 1, drawn large on the left side of the frame, with a clear readable expression. On the right side, huge heavy black condensed uppercase headline text reads exactly \"5 SILENT MOVES\", with the words \"SILENT\" set as white letters on a solid burnt orange block. The headline fills almost half of the frame and stays readable at very small size. No other text, no watermark. Bold, simple, high contrast, one clear focal point.", "url": ""}, {"k": "C", "overlay": "DON'T GET REVENGE", "accent": "DON'T", "en": "The man drops a lit match into a glass of water with a calm face, a thin line of smoke rising from the glass.", "ar": "البطل يسقط عود ثقاب مشتعلًا في كأس ماء بهدوء", "prompt": "IMAGE REFERENCES: image 1 = the channel mascot character. YouTube thumbnail, 16:9, flat 2D cartoon illustration with thick clean black outlines and flat solid colors on a soft pale yellow background. The man drops a lit match into a glass of water with a calm face, a thin line of smoke rising from the glass. The man is the exact same character as image 1, drawn large on the right side of the frame, with a clear readable expression. On the left side, huge heavy black condensed uppercase headline text reads exactly \"DON'T GET REVENGE\", with the words \"DON'T\" set as white letters on a solid black block. The headline fills almost half of the frame and stays readable at very small size. No other text, no watermark. Bold, simple, high contrast, one clear focal point.", "url": ""}], "vo": "Someone hurt you. And part of you wants them to feel it. So you write the message. The perfect comeback. The post they're supposed to see. In 2008, psychologists gave people a chance to punish someone who had cheated them. Everyone expected revenge to feel good. The people who got it felt worse. And they couldn't stop thinking about the person. Revenge keeps them in your head. These five quiet behaviors do the opposite. And the last one is the hardest. One. You don't give them a reaction. They said it, or did it, and then they watched your face. Your anger is useful to them. It turns the story from what they did, into how you reacted. And venting doesn't even help you. In a 2002 study, angry people hit a punching bag to let it out. They ended up angrier and more aggressive than the people who just sat quietly for two minutes. So the first move is no move. You feel all of it. You just don't perform it for them. Two. You stop explaining yourself. You want them to understand. So you explain. Then you explain the explanation. Here's the hard part. They understood the first time. Every extra sentence tells them one thing. Their opinion still runs your day. Say it once. Clearly. Then let the silence do the rest. Three. You change their access, not your attitude. You don't turn cold. You don't turn rude. You stay polite. But the door they used to walk through, isn't open anymore. They don't get your late nights. Your secrets. Your first call when something good happens. People don't notice a slammed door for long. They notice a quiet one for years. Four. You get better. Quietly. No announcement. No gym selfie with a caption about haters. You sleep. You train. You fix your money. You read the book. You call the friends you dropped. The post says, look what you lost. The quiet says something much heavier. I'm not thinking about you at all. And one day they see you by accident. Calm. Lighter. Fine. Five. You don't come back for the ending. This is the hard one. You want the last word. The apology. The scene where they finally get it. In 1927, a psychologist noticed that waiters remembered unpaid orders perfectly, and forgot them the moment the bill was closed. The mind holds on to what's unfinished. The fight you come back for closes the story for them. So you lower your hand. And you leave the last page blank. But here's the trap. Silence can also be a weapon. Ignoring someone on purpose, to punish them, hurts like physical pain. If you go quiet so they'll chase you, you're still playing their game. You've only changed the costume. The silence that works isn't aimed at them. It's you, giving your attention back to your own life. You can't make someone regret you. You can only become someone worth regretting. Which of the five is hardest for you? Tell me the number below. And if she acts strange around you but never comes closer, this one explains why.", "words": 524, "dur": 214.15999999999997, "srt": "1\n00:00:00,000 --> 00:00:04,800\nSomeone hurt you. And part of you wants them to feel it.\n\n2\n00:00:04,900 --> 00:00:10,520\nSo you write the message. The perfect comeback. The post they're supposed to see.\n\n3\n00:00:10,600 --> 00:00:16,240\nIn 2008, psychologists gave people a chance to punish someone who had cheated them.\n\n4\n00:00:16,400 --> 00:00:24,760\nEveryone expected revenge to feel good. The people who got it felt worse. And they couldn't stop thinking about the person.\n\n5\n00:00:24,900 --> 00:00:32,880\nRevenge keeps them in your head. These five quiet behaviors do the opposite. And the last one is the hardest.\n\n6\n00:00:33,000 --> 00:00:35,800\nOne. You don't give them a reaction.\n\n7\n00:00:35,900 --> 00:00:40,720\nThey said it, or did it, and then they watched your face.\n\n8\n00:00:40,800 --> 00:00:48,040\nYour anger is useful to them. It turns the story from what they did, into how you reacted.\n\n9\n00:00:48,200 --> 00:00:56,160\nAnd venting doesn't even help you. In a 2002 study, angry people hit a punching bag to let it out.\n\n10\n00:00:56,300 --> 00:01:03,080\nThey ended up angrier and more aggressive than the people who just sat quietly for two minutes.\n\n11\n00:01:03,200 --> 00:01:10,800\nSo the first move is no move. You feel all of it. You just don't perform it for them.\n\n12\n00:01:10,900 --> 00:01:12,920\nTwo. You stop explaining yourself.\n\n13\n00:01:13,000 --> 00:01:18,240\nYou want them to understand. So you explain. Then you explain the explanation.\n\n14\n00:01:18,400 --> 00:01:21,960\nHere's the hard part. They understood the first time.\n\n15\n00:01:22,100 --> 00:01:27,280\nEvery extra sentence tells them one thing. Their opinion still runs your day.\n\n16\n00:01:27,400 --> 00:01:31,800\nSay it once. Clearly. Then let the silence do the rest.\n\n17\n00:01:31,900 --> 00:01:35,120\nThree. You change their access, not your attitude.\n\n18\n00:01:35,200 --> 00:01:39,640\nYou don't turn cold. You don't turn rude. You stay polite.\n\n19\n00:01:39,800 --> 00:01:44,160\nBut the door they used to walk through, isn't open anymore.\n\n20\n00:01:44,300 --> 00:01:50,280\nThey don't get your late nights. Your secrets. Your first call when something good happens.\n\n21\n00:01:50,400 --> 00:01:56,400\nPeople don't notice a slammed door for long. They notice a quiet one for years.\n\n22\n00:01:56,500 --> 00:01:58,520\nFour. You get better. Quietly.\n\n23\n00:01:58,600 --> 00:02:02,640\nNo announcement. No gym selfie with a caption about haters.\n\n24\n00:02:02,800 --> 00:02:09,960\nYou sleep. You train. You fix your money. You read the book. You call the friends you dropped.\n\n25\n00:02:10,100 --> 00:02:18,080\nThe post says, look what you lost. The quiet says something much heavier. I'm not thinking about you at all.\n\n26\n00:02:18,200 --> 00:02:22,600\nAnd one day they see you by accident. Calm. Lighter. Fine.\n\n27\n00:02:22,700 --> 00:02:25,920\nFive. You don't come back for the ending.\n\n28\n00:02:26,000 --> 00:02:33,640\nThis is the hard one. You want the last word. The apology. The scene where they finally get it.\n\n29\n00:02:33,800 --> 00:02:41,760\nIn 1927, a psychologist noticed that waiters remembered unpaid orders perfectly, and forgot them the moment the bill was closed.\n\n30\n00:02:41,900 --> 00:02:49,080\nThe mind holds on to what's unfinished. The fight you come back for closes the story for them.\n\n31\n00:02:49,200 --> 00:02:54,000\nSo you lower your hand. And you leave the last page blank.\n\n32\n00:02:54,100 --> 00:02:55,720\nBut here's the trap.\n\n33\n00:02:55,800 --> 00:03:02,640\nSilence can also be a weapon. Ignoring someone on purpose, to punish them, hurts like physical pain.\n\n34\n00:03:02,800 --> 00:03:09,960\nIf you go quiet so they'll chase you, you're still playing their game. You've only changed the costume.\n\n35\n00:03:10,100 --> 00:03:17,280\nThe silence that works isn't aimed at them. It's you, giving your attention back to your own life.\n\n36\n00:03:17,400 --> 00:03:22,600\nYou can't make someone regret you. You can only become someone worth regretting.\n\n37\n00:03:22,700 --> 00:03:27,920\nWhich of the five is hardest for you? Tell me the number below.\n\n38\n00:03:28,000 --> 00:03:34,040\nAnd if she acts strange around you but ne :54 The Mistake\n3:24 What To Do\n3:44 Close\n\n🧠 THE SCIENCE:\nMoore (1985) observed more than 200 women in social settings and catalogued 52 nonverbal signals that reliably came before a man approached. Clark and Hatfield (1989) showed how differently men and women respond to direct offers from strangers. Pinker, Nowak and Lee (2008) explained why people use indirect signals when a direct ask carries social risk. Farris and colleagues (2008) found that men frequently confuse friendliness with interest, and interest with friendliness.\n\n💡 KEY TAKEAWAY:\nA signal is an invitation to talk, not a promise. Ask the small question and let her answer it.\n\n📚 RESEARCH MENTIONED:\n• Moore, M. M. (1985). Nonverbal courtship patterns in women: Context and consequences. Ethology and Sociobiology.\n• Clark, R. D., & Hatfield, E. (1989). Gender differences in receptivity to sexual offers. Journal of Psychology & Human Sexuality.\n• Pinker, S., Nowak, M. A., & Lee, J. J. (2008). The logic of indirect speech. Proceedings of the National Academy of Sciences.\n• Farris, C., Treat, T. A., Viken, R. J., & McFall, R. M. (2008). Perceptual mechanisms that characterize gender differences in decoding women's sexual intent. Psychological Science.\n• Whitchurch, E. R., Wilson, T. D., & Gilbert, D. T. (2011). He loves me, he loves me not: Uncertainty can increase romantic attraction. Psychological Science.\n\nThis video is for education and self-reflection. It is not therapy or relationship counseling.\n\n🔔 Subscribe to Unchased for the psychology of men who stopped chasing.\n\n#Psychology #Attraction #BodyLanguage #MensPsychology #Dating #HumanBehavior #Unchased", "tags": "why women act weird around you, signs she likes you but is hiding it, why she never approaches, female psychology, signs a woman is attracted to you, body language of attraction, mixed signals psychology, she acts nervous around me, hot and cold behavior, psychology of attraction, dating psychology, psychology explained, unchased", "thumbs": [{"k": "A", "overlay": "WHY SHE ACTS WEIRD", "accent": "WEIRD", "en": "The man stands with a puzzled face and one eyebrow raised, while behind him a small woman in a green coat peeks at him from behind a large potted plant with blush marks on her cheeks.", "ar": "البطل بوجه محتار وخلفه امرأة تتلصص عليه من خلف نبتة وخداها محمران", "prompt": "IMAGE REFERENCES: image 1 = the channel mascot character. YouTube thumbnail, 16:9, flat 2D cartoon illustration with thick clean black outlines and flat solid colors on a pure white background. The man stands with a puzzled face and one eyebrow raised, while behind him a small woman in a green coat peeks at him from behind a large potted plant with blush marks on her cheeks. The man is the exact same character as image 1, drawn large on the right side of the frame, with a clear readable expression. On the left side, huge heavy black condensed uppercase headline text reads exactly \"WHY SHE ACTS WEIRD\", with the words \"WEIRD\" set as white letters on a solid burnt orange block. The headline fills almost half of the frame and stays readable at very small size. No other text, no watermark. Bold, simple, high contrast, one clear focal point.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3LvxZ95GNv9hPk8ex4RElfiPNA4/hf_20261111_212005_52a65631-ea0f-4f85-9a71-d495e19f0e98.png"}, {"k": "B", "overlay": "SHE NEVER APPROACHES", "accent": "NEVER", "en": "The man reads a book on a bench while a small woman in a green coat walks past behind him looking at him sideways, a small heart half hidden behind her back.", "ar": "البطل يقرأ على مقعد وامرأة تمر خلفه وتنظر إليه جانبًا وتخفي قلبًا خلف ظهرها", "prompt": "IMAGE REFERENCES: image 1 = the channel mascot character. YouTube thumbnail, 16:9, flat 2D cartoon illustration with thick clean black outlines and flat solid colors on a warm off white background. The man reads a book on a bench while a small woman in a green coat walks past behind him looking at him sideways, a small heart half hidden behind her back. The man is the exact same character as image 1, drawn large on the left side of the frame, with a clear readable expression. On the right side, huge heavy black condensed uppercase headline text reads exactly \"SHE NEVER APPROACHES\", with the words \"NEVER\" set as white letters on a solid burnt orange block. The headline fills almost half of the frame and stays readable at very small size. No other text, no watermark. Bold, simple, high contrast, one clear focal point.", "url": ""}, {"k": "C", "overlay": "SHE LIKES YOU BUT HIDES IT", "accent": "HIDES IT", "en": "The man scratches his head with a confused half smile while a small woman beside him looks away with crossed arms and red cheeks.", "ar": "البطل يحك رأسه بحيرة وامرأة بجانبه تشيح بوجهها وخداها محمران", "prompt": "IMAGE REFERENCES: image 1 = the channel mascot character. YouTube thumbnail, 16:9, flat 2D cartoon illustration with thick clean black outlines and flat solid colors on a soft pale yellow background. The man scratches his head with a confused half smile while a small woman beside him looks away with crossed arms and red cheeks. The man is the exact same character as image 1, drawn large on the right side of the frame, with a clear readable expression. On the left side, huge heavy black condensed uppercase headline text reads exactly \"SHE LIKES YOU BUT HIDES IT\", with the words \"HIDES IT\" set as white letters on a solid black block. The headline fills almost half of the frame and stays readable at very small size. No other text, no watermark. Bold, simple, high contrast, one clear focal point.", "url": ""}], "vo": "She laughs a little too loud when you're in the room. She goes quiet the second you look at her. Monday she's warm. Wednesday she walks past like you don't exist. And in all this time, she has never once walked up to you. You think she's weird. Or she can't stand you. Researchers who watched this for hundreds of hours saw something else. First, the study that changes how you see all of it. In 1985, a researcher sat in bars and campus hangouts and watched more than two hundred women. She wasn't watching who approached. She was watching what happened before. She counted fifty two signals. A short glance. A hair flip. A laugh. Moving a little closer. And here's what she found. The men who walked over thought it was their idea. Almost every time, a signal came first. So she is approaching. Just not with her feet. So why doesn't she just say it? Because a direct ask can't be taken back. If she says it and you say no, everyone knows. A signal can be denied. I was just being friendly. Psychologists call it the logic of indirect speech. You do it too. Every time you say, we should grab coffee sometime, instead of, I like you. One. Nerves that look like disinterest. She's relaxed and funny with everyone. With you, she drops things and forgets what she was saying. People are smooth when nothing is at stake. The stumble shows up when something matters. Two. Warm, then cold. She gave you too much yesterday. A long look. A real laugh. Today she pulls it back. It's not a game. It's damage control. She showed her cards and she isn't sure what you're holding. Three. She keeps ending up near you. The same coffee line. The seat one over. The hallway you always take. In that 1985 study, simply moving into a man's space was one of the most common signals. It gives him an easy opening. Four. She remembers small things. The band you mentioned once. Your sister's name. How you take your coffee. Attention is expensive. Nobody spends it on someone they feel nothing about. Five. She teases you, and only you. A little jab. A fake insult with a smile. It's a safe way to create a private joke between two people. Six. Her friends act different around you. They go quiet when you walk up. They smile at each other. One of them suddenly has to leave. That's the clearest sign on the list. You've been discussed. Now the mistake that ruins all of this. In a 2008 study, men looked at photos of women and had to sort friendly from interested. They mixed them up constantly. In both directions. So one sign means nothing. A waitress who smiles is doing her job. A coworker who's kind is being kind. Three or four signs, from the same person, over weeks. That's a pattern. And a pattern is still not a yes. So here's what you do. Don't confess. Don't test her. Just start one small, normal conversation. If she's interested, she'll make it longer. She'll ask something back. She'll stay. If she isn't, she'll be polite and brief. And you've lost nothing. You got your answer without making it heavy. A signal isn't a promise. It's an invitation to talk. So talk. Which of the six have you seen? Tell me below. And next, the seven traits that make a man rare.", "words": 581, "dur": 237.44, "srt": "1\n00:00:00,000 --> 00:00:04,400\nShe laughs a little too loud when you're in the room.\n\n2\n00:00:04,500 --> 00:00:08,120\nShe goes quiet the second you look at her.\n\n3\n00:00:08,200 --> 00:00:12,640\nMonday she's warm. Wednesday she walks past like you don't exist.\n\n4\n00:00:12,800 --> 00:00:17,960\nAnd in all this time, she has never once walked up to you.\n\n5\n00:00:18,100 --> 00:00:26,080\nYou think she's weird. Or she can't stand you. Researchers who watched this for hundreds of hours saw something else.\n\n6\n00:00:26,200 --> 00:00:30,600\nFirst, the study that changes how you see all of it.\n\n7\n00:00:30,700 --> 00:00:41,920\nIn 1985, a researcher sat in bars and campus hangouts and watched more than two hundred women. She wasn't watching who approached. She was watching what happened before.\n\n8\n00:00:42,000 --> 00:00:48,840\nShe counted fifty two signals. A short glance. A hair flip. A laugh. Moving a little closer.\n\n9\n00:00:49,000 --> 00:00:57,760\nAnd here's what she found. The men who walked over thought it was their idea. Almost every time, a signal came first.\n\n10\n00:00:57,900 --> 00:01:01,480\nSo she is approaching. Just not with her feet.\n\n11\n00:01:01,600 --> 00:01:04,400\nSo why doesn't she just say it?\n\n12\n00:01:04,500 --> 00:01:11,720\nBecause a direct ask can't be taken back. If she says it and you say no, everyone knows.\n\n13\n00:01:11,800 --> 00:01:19,040\nA signal can be denied. I was just being friendly. Psychologists call it the logic of indirect speech.\n\n14\n00:01:19,200 --> 00:01:26,360\nYou do it too. Every time you say, we should grab coffee sometime, instead of, I like you.\n\n15\n00:01:26,500 --> 00:01:28,880\nOne. Nerves that look like disinterest.\n\n16\n00:01:29,000 --> 00:01:35,800\nShe's relaxed and funny with everyone. With you, she drops things and forgets what she was saying.\n\n17\n00:01:35,900 --> 00:01:41,920\nPeople are smooth when nothing is at stake. The stumble shows up when something matters.\n\n18\n00:01:42,000 --> 00:01:43,640\nTwo. Warm, then cold.\n\n19\n00:01:43,800 --> 00:01:50,560\nShe gave you too much yesterday. A long look. A real laugh. Today she pulls it back.\n\n20\n00:01:50,700 --> 00:01:57,880\nIt's not a game. It's damage control. She showed her cards and she isn't sure what you're holding.\n\n21\n00:01:58,000 --> 00:02:00,800\nThree. She keeps ending up near you.\n\n22\n00:02:00,900 --> 00:02:06,120\nThe same coffee line. The seat one over. The hallway you always take.\n\n23\n00:02:06,200 --> 00:02:15,440\nIn that 1985 study, simply moving into a man's space was one of the most common signals. It gives him an easy opening.\n\n24\n00:02:15,600 --> 00:02:17,560\nFour. She remembers small things.\n\n25\n00:02:17,700 --> 00:02:22,880\nThe band you mentioned once. Your sister's name. How you take your coffee.\n\n26\n00:02:23,000 --> 00:02:27,800\nAttention is expensive. Nobody spends it on someone they feel nothing about.\n\n27\n00:02:27,900 --> 00:02:30,720\nFive. She teases you, and only you.\n\n28\n00:02:30,800 --> 00:02:39,240\nA little jab. A fake insult with a smile. It's a safe way to create a private joke between two people.\n\n29\n00:02:39,400 --> 00:02:42,160\nSix. Her friends act different around you.\n\n30\n00:02:42,300 --> 00:02:49,880\nThey go quiet when you walk up. They smile at each other. One of them suddenly has to leave.\n\n31\n00:02:50,000 --> 00:02:54,000\nThat's the clearest sign on the list. You've been discussed.\n\n32\n00:02:54,100 --> 00:02:57,320\nNow the mistake that ruins all of this.\n\n33\n00:02:57,400 --> 00:03:07,440\nIn a 2008 study, men looked at photos of women and had to sort friendly from interested. They mixed them up constantly. In both directions.\n\n34\n00:03:07,600 --> 00:03:15,560\nSo one sign means nothing. A waitress who smiles is doing her job. A coworker who's kind is being kind.\n\n35\n00:03:15,700 --> 00:03:24,080\nThree or four signs, from the same person, over weeks. That's a pattern. And a pattern is still not a yes.\n\n36\n00:03:24,200 --> 00:03:26,200\nSo here's what you do.\n\n37\n00:03:26,300 --> 00:03:30,720\nDon't confess. Don't test her. Just start one small, normal conversation.\n\n38\n00:03:30,800 --> 00:03:36,040\nIf she's interested, she'll make it longer. She'll ask something back. She'll stay.\n\n39\n00:03:36,200 --> 00:03:44,160\nIf she isn't, she'll be polite and brief. And you've lost nothing. You got your answer without making it heavy.\n\n40\n00:03:44,300 --> 00:03:49,080\nA signal isn't a promise. It's an invitation to talk. So talk.\n\n41\n00:03:49,200 --> 00:03:53,200\nWhich of the six have you seen? Tell me below.\n\n42\n00:03:53,300 --> 00:03:57,320\nAnd next, the seven traits that make a man rare.\n\n", "scenes": [{"n": 1, "st": 0.0, "f": "H", "sec": "Hook", "vo": "She laughs a little too loud when you're in the room.", "ar": "البطل عند الطابعة وامرأة خلفه تضحك بصوت عالٍ وتنظر إليه", "p": "The man stands at an office printer while a woman at a desk behind him laughs loudly with a hand over her mouth and glances at him. Medium wide shot. Bright office light, noticing mood. The man is the ck clean black outlines, flat solid colors, minimal background on warm off white, burnt orange as the only accent color, simple shapes, clean uncluttered composition.", "a": ""}]}, {"id": "09", "titles": ["7 Traits of a Rare Man (Most Men Never Build Them)", "If You Have These 7 Traits, You're a Rare Kind of Man", "The Psychology of a Rare Man"], "pick": "النموذج 1 مبني على فيديو Traits of a Rare Man الذي حقق 208 آلاف مشاهدة وتفوق 449 مرة على متوسط قناته، والقوس يضيف تحديًا يجعل المشاهد يختبر نفسه.", "animal": "7 Traits of a Rare Man|💎", "desc": "7 Traits of a Rare Man (Most Men Never Build Them)\n\nMost men are loud about what they will do and quiet about what they actually did. A rare man is the other way around. This video covers seven traits that research links to men people trust, follow and remember, starting with one that two thirds of men failed in a famous experiment.\n\n📌 WHAT YOU'LL LEARN:\n✓ Why most men chose an electric shock over sitting alone\n✓ What a 32 year study found about self control\n✓ Why keeping small promises changes how people see you\n✓ What happens to your image when you talk about others\n✓ Why admitting you were wrong raises respect\n✓ The one trait nobody can fake for long\n\n⏱️ CHAPTERS:\n0:00 Intro\n0:37 Alone\n1:00 His Word\n1:23 The Long Game\n1:51 Not Gossip\n2:17 I Was Wrong\n2:38 Calm\n3:00 Unseen Kindness\n3:24 The Truth\n3:43 Close\n\n🧠 THE SCIENCE:\nWilson and colleagues (2014) left people alone in a room for up to 15 minutes with nothing but their thoughts, and 12 of 18 men chose to give themselves an electric shock. Moffitt and colleagues (2011) followed 1,000 children to age 32 and found that childhood self control predicted adult health, finances and criminal record. Skowronski and colleagues (1998) showed that people attach to you the traits you describe in others. Leary and colleagues (2017) found that intellectually humble people judge evidence more carefully.\n\n💡 KEY TAKEAWAY:\nRare is not something you are. It is lack outlines, flat solid colors, minimal background on warm off white, burnt orange as the only accent color, simple shapes, clean uncluttered composition.", "a": ""}]}, {"id": "10", "titles": ["When Someone Hurts You and Acts Like Nothing Happened, Remember These 5 Things", "Why They Act Like Nothing Happened (Psychology Explained)", "They Hurt You and Moved On Like It Was Nothing. Here's Why"], "pick": "النموذج 1 مطابق لصيغة فيديو حقق 212 ألف مشاهدة عند قناة فيها 2.8 ألف مشترك، وتفوق 295 مرة على متوسطها. العنوان يصف شعورًا يعرفه المشاهد بدقة.", "animal": "When Someone Hurts You and Acts Like Nothing Happened|🧊", "desc": "When Someone Hurts You and Acts Like Nothing Happened, Remember These 5 Things\n\nThey said it, or did it, and the next day they were asking what you want for lunch. No apology. No mention. As if you imagined the whole thing. This video explains the research on why the person who hurt you honestly remembers a smaller story than you do, and five things to remember so their silence stops costing you sleep.\n\n📌 WHAT YOU'LL LEARN:\n✓ Why the two of you remember two different events\n✓ The 1990 study on victims and perpetrators\n✓ What stops people from apologizing\n✓ Why waiting for an apology keeps you stuck\n✓ What holding a grudge does to your heart rate\n✓ The difference between forgiving and letting them back in\n\n⏱️ CHAPTERS:\n0:00 Intro\n0:28 Two Stories\n1:03 Self Image\n1:23 Stop Waiting\n1:45 Say It Once\n2:12 Forgive For You\n2:39 The Line\n2:58 Close\n\n🧠 THE SCIENCE:\nBaumeister, Stillwell and Wotman (1990) collected stories from the same people as victims and as perpetrators. As perpetrators, they described the event as minor, understandable and finished. As victims, they described lasting harm that was never resolved. Schumann (2018) reviewed why people avoid apologizing, including the threat an apology poses to their self-image. Witvliet, Ludwig and Vander Laan (2001) found that rehearsing a grudge raised heart rate and blood pressure, while imagining forgiveness lowered them.\n\n💡 KEY TAKEAWAY:\nTheir silence is about what they can face. It was never a measure of what you are worth.\n\n📚 RESEARCH MENTIONED:\n• Baumeister, R. F., Stillwell, A., & Wotman, S. R. (1990). Victim and perpetrator accounts of interpersonal conflict. Journal of Personality and Social Psychology.\n• Schumann, K. (2018). The psychology of offering an apology. Current Directions in Psychological Science.\n• Witvliet, C. V. O., Ludwig, T. E., & Vander Laan, K. L. (2001). Granting forgiveness or harboring grudges. Psychological Science.\n• Festinger, L. (1957). A theory of cognitive dissonance. Stanford University Press.\n• Worthington, E. L., & Scherer, M. (2004). Forgiveness is an emotion-focused coping strategy. Psychology & Health.\n\nThis video is for education and self-reflection. It is not therapy or relationship counseling.\n\n🔔 Subscribe to Unchased for the psychology of men who stopped chasing.\n\n#Psychology #EmotionalHealing #SelfRespect #MensPsychology #Forgiveness #HumanBehavior #Unchased", "tags": "when someone hurts you and acts like nothing happened, why they act like nothing happened, they never apologized, how to deal with someone who hurt you, closure psychology, no apology psychology, forgiveness psychology, moving on without closure, emotional healing, self respect, male psychology, psychology explained, unchased", "thumbs": [{"k": "A", "overlay": "THEY ACT LIKE NOTHING HAPPENED", "accent": "NOTHING", "en": "The man stands with a hurt serious face and a small crack drawn across his chest, while beside him a small cartoon figure whistles casually and looks the other way.", "ar": "البطل بوجه مجروح وشق صغير على صدره وبجانبه شخص يصفر وينظر للجهة الأخرى", "prompt": "IMAGE REFERENCES: image 1 = the channel mascot character. YouTube thumbnail, 16:9, flat 2D cartoon illustration with thick clean black outlines and flat solid colors on a pure white background. The man stands with a hurt serious face and a small crack drawn across his chest, while beside him a small cartoon figure whistles casually and looks the other way. The man is the exact same character as image 1, drawn large on the right side of the frame, with a clear readable expression. On the left side, huge heavy black condensed uppercase headline text reads exactly \"THEY ACT LIKE NOTHING HAPPENED\", with the words \"NOTHING\" set as white letters on a solid burnt orange block. The headline fills almost half of the frame and stays readable at very small size. No other text, no watermark. Bold, simple, high contrast, one clear focal point.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3LvxZ95GNv9hPk8ex4RElfiPNA4/hf_20261111_212226_b33b68a2-83ef-4ac6-b37e-6bcaa2ac5207.png"}, {"k": "B", "overlay": "NO APOLOGY", "accent": "NO", "en": "The man looks at a phone in his hand showing a cheerful short message with a smiling face, his own face flat and tired.", "ar": "البطل ينظر لهاتف عليه رسالة مرحة قصيرة ووجهه متعب", "prompt": "IMAGE REFERENCES: image 1 = the channel mascot character. YouTube thumbnail, 16:9, flat 2D cartoon illustration with thick clean black outlines and flat solid colors on a warm off white background. The man looks at a phone in his hand showing a cheerful short message with a smiling face, his own face flat and tired. The man is the exact same character as image 1, drawn large on the left side of the frame, with a clear readable expression. On the right side, huge heavy black condensed uppercase headline text reads exactly \"NO APOLOGY\", with the words \"NO\" set as white letters on a solid burnt orange block. The headline fills almost half of the frame and stays readable at very small size. No other text, no watermark. Bold, simple, high contrast, one clear focal point.", "url": ""}, {"k": "C", "overlay": "WHY THEY NEVER SAY SORRY", "accent": "NEVER", "en": "The man holds out an empty open hand and looks at the viewer with raised eyebrows, a small empty speech bubble floating above his palm.", "ar": "البطل يمد يده فارغة وينظر للمشاهد وفقاعة كلام فارغة فوق كفه", "prompt": "IMAGE REFERENCES: image 1 = the channel mascot character. YouTube thumbnail, 16:9, flat 2D cartoon illustration with thick clean black outlines and flat solid colors on a soft pale yellow background. The man holds out an empty open hand and looks at the viewer with raised eyebrows, a small empty speech bubble floating above his palm. The man is the exact same character as image 1, drawn large on the right side of the frame, with a clear readable expression. On the left side, huge heavy black condensed uppercase headline text reads exactly \"WHY THEY NEVER SAY SORRY\", with the words \"NEVER\" set as white letters on a solid black block. The headline fills almost half of the frame and stays readable at very small size. No other text, no watermark. Bold, simple, high contrast, one clear focal point.", "url": ""}], "vo": "They said it. Or they did it. And you went home with it sitting in your chest. The next morning, they texted. Hey. What do you want for lunch? No sorry. No mention. Like it never happened. And you start to wonder. Am I overreacting? Did I imagine it? You didn't imagine it. And psychology has a very clear explanation for what they're doing. Here are five things to remember. One. They remember a smaller story. In 1990, psychologists asked people to write about a time someone hurt them. Then about a time they hurt someone else. Same people. Completely different stories. When they were the one who was hurt, the pain lasted. It changed things. It was never really dealt with. When they were the one who did it, it was small. There was a good reason. And it was over. So they're not always pretending. In their head, there's nothing left to discuss. Two. An apology costs them a picture of themselves. Almost everyone believes, I'm a good person. Hurting you doesn't fit that picture. So the mind fixes it fast. It wasn't that bad. He's too sensitive. He started it. Saying sorry m ning your no invites a debate\n✓ The one rule behind all eight habits\n\n⏱️ CHAPTERS:\n0:00 Intro\n0:22 Sorry\n0:44 Explaining No\n1:06 Always Available\n1:36 Laughing Along\n1:57 The Phone\n2:25 Self Insults\n2:49 Filling Silence\n3:12 Small Promises\n3:38 One Rule\n3:53 Close\n\n🧠 THE SCIENCE:\nPrzybylski and Weinstein (2013) found that the mere presence of a phone on the table lowered closeness and trust between two people talking. Worchel, Lee and Adewole (1975) showed that the same cookies were rated as more desirable when only a few were available. Anderson and colleagues (2012) found that people who expressed confidence in their own ability were granted more status by their group, because others take your view of yourself as a clue.\n\n💡 KEY TAKEAWAY:\nPeople learn how to treat you by watching how you treat yourself.\n\n📚 RESEARCH MENTIONED:\n• Przybylski, A. K., & Weinstein, N. (2013). Can you connect with me now? How the presence of mobile communication technology influences face-to-face conversation quality. Journal of Social and Personal Relationships.\n• Worchel, S., Lee, J., & Adewole, A. (1975). Effects of supply and demand on ratings of object value. Journal of Personality and Social Psychology.\n• Anderson, C., Brion, S., Moore, D. A., & Kennedy, J. A. (2012). A status-enhancement account of overconfidence. Journal of Personality and Social Psychology.\n• Misra, S., Cheng, L., Genevie, J., & Yuan, M. (2016). The iPhone effect. Environment and Behavior.\n\nThis video is for education and self-reflection. It is not therapy or relationship counseling.\n\n🔔 Subscribe to Unchased for the psychology of men who stopped chasing.\n\n#Psychology #Respect #MensPsychology #SelfRespect #Confidence #HumanBehavior #Unchased", "tags": "habits that cost you respect, why people don't respect you, how to be respected, losing respect habits, stop over apologizing, stop over explaining, how to command respect, self respect psychology, people pleasing habits, quiet confidence, male psychology, respect psychology, psychology explained, unchased", "thumbs": [{"k": "A", "overlay": "8 HABITS KILLING YOUR RESPECT", "accent": "RESPECT", "en": "The man stands with slumped shoulders and a nervous smile holding both palms up in apology, while a tall gauge beside him drops toward empty.", "ar": "البطل بكتفين منحنيين وابتسامة متوترة يرفع كفيه معتذرًا ومؤشر بجانبه يهبط", "prompt": "IMAGE REFERENCES: image 1 = the channel mascot character. YouTube thumbnail, 16:9, flat 2D cartoon illustration with thick clean black outlines and flat solid colors on a pure white background. The man stands with slumped shoulders and a nervous smile holding both palms up in apology, while a tall gauge beside him drops toward empty. The man is the exact same character as image 1, drawn large on the right side of the frame, with a clear readable expression. On the left side, huge heavy black condensed uppercase headline text reads exactly \"8 HABITS KILLING YOUR RESPECT\", with the words \"RESPECT\" set as white letters on a solid burnt orange block. The headline fills almost half of the frame and stays readable at very small size. No other text, no watermark. Bold, simple, high contrast, one clear focal point.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3LvxZ95GNv9hPk8ex4RElfiPNA4/hf_20261111_212324_0038628c-f88f-4564-900b-142ea7c97289.png"}, {"k": "B", "overlay": "STOP SAYING SORRY", "accent": "SORRY", "en": "The man covers his own mouth with one hand and looks at the viewer with wide eyes, a small speech bubble shape with a line through it beside him.", "ar": "البطل يغطي فمه بيده وينظر للمشاهد وبجانبه فقاعة كلام مشطوبة", "prompt": "IMAGE REFERENCES: image 1 = the channel mascot character. YouTube thumbnail, 16:9, flat 2D cartoon illustration with thick clean black outlines and flat solid colors on a warm off white background. The man covers his own mouth with one hand and looks at the viewer with wide eyes, a small speech bubble shape with a line through it beside him. The man is the exact same character as image 1, drawn large on the left side of the frame, with a clear readable expression. On the right side, huge heavy black condensed uppercase headline text reads exactly \"STOP SAYING SORRY\", with the words \"SORRY\" set as white letters on a solid burnt orange block. The headline fills almost half of the frame and stays readable at very small size. No other text, no watermark. Bold, simple, high contrast, one clear focal point.", "url": ""}, {"k": "C", "overlay": "WHY NOBODY RESPECTS YOU", "accent": "NOBODY", "en": "The man stands talking with one hand raised while three small cartoon figures in front of him all look down at their phones.", "ar": "البطل يتكلم ويده مرفوعة وثلاثة أشخاص أمامه ينظرون لهواتفهم", "prompt": "IMAGE REFERENCES: image 1 = the channel mascot character. YouTube thumbnail, 16:9, flat 2D cartoon illustration with thick clean black outlines and flat solid colors on a soft pale yellow background. The man stands talking with one hand raised while three small cartoon figures in front of him all look down at their phones. The man is the exact same character as image 1, drawn large on the right side of the frame, with a clear readable expression. On the left side, huge heavy black condensed uppercase headline text reads exactly \"WHY NOBODY RESPECTS YOU\", with the words \"NOBODY\" set as white letters on a solid black block. The headline fills almost half of the frame and stays readable at very small size. No other text, no watermark. Bold, simple, high contrast, one clear focal point.", "url": ""}], "vo": "Nobody tells you they've stopped respecting you. They just start interrupting. Replying late. Making the plan without you. And it almost never comes from one big moment. It comes from small habits you repeat every day. Here are eight of them. Number five is sitting on the table in front of you right now. One. Sorry, for things that aren't your fault. Sorry, quick question. Sorry, can I get past. Sorry, to a guy who walked into you. Each one is tiny. Together, they tell the room you think you're in the way. Keep sorry for when you've actually done something. Everywhere else, say thank you or excuse me. Two. Explaining your no. I can't, because my cousin is in town, and I have this thing, and honestly I've been so tired. Every reason you give is a door. Now they can argue with the reason instead of accepting the answer. I can't make it. Thanks for asking. That's a full sentence. Three. Being available every time. In 1975, researchers handed people a cookie from a jar. Some jars had ten cookies. Some had two. Same cookies. The ones from the nearly empty jar were rated as better, and worth more. If you answer in four seconds, cancel your plans, and say yes to everything, you are the full jar. This isn't about playing games. It's about actually having a life that some requests don't fit into. Four. Laughing when the joke is on you. Someone takes a shot at you in front of the group. Everyone laughs. So do you. Your laugh is a signature. It says, this is allowed. You don't need a comeback. Just don't laugh. Hold their eyes for one second, and move on. Five. The phone on the table. In 2013, researchers had pairs of strangers talk for ten minutes. For half of them, a phone sat on the table nearby. Nobody touched it. Those pairs felt less close, and trusted each other less. Just from it being there. A phone on the table says, you have me until something better lights up. Put it away. People feel it immediately. Six. Insulting yourself first. I'm terrible at this. Classic me. I'm an idiot. You say it to seem humble. But people don't have time to study you. They take your word for it. In a 2012 study, groups gave more status to the people who rated themselves highly. You don't have to brag. Just stop writing the label for them. Seven. Filling every silence. There's a pause. It lasts two seconds. And you rush in with anything, just to end it. The person who can't stand a pause always gives away more. In a negotiation. In an argument. On a date. Say your sentence. Then let it sit. The silence isn't empty. It's working for you. Eight. Breaking promises nobody else heard. Gym tomorrow. Up at six. No more texting her. Nobody knows you said it. Except you. And you're the one witness you can't fool. Every broken promise is a vote for the idea that your word means nothing. That leaks out. In your voice. In how you stand. Other people can hear a man who doesn't believe himself. All eight come from the same place. Each one is you, treating your own time, your own word and your own presence as cheap. People don't decide how to treat you. They copy how you treat yourself. So don't try to fix all eight. Pick one. Do it for a week. Watch who notices. Which one is yours? Tell me the number below. And next. Seven signs someone is testing how weak you are.", "words": 609, "dur": 248.75999999999996, "srt": "1\n00:00:00,000 --> 00:00:02,800\nNobody tells you they've stopped respecting you.\n\n2\n00:00:02,900 --> 00:00:07,320\nThey just start interrupting. Replying late. Making the plan without you.\n\n3\n00:00:07,400 --> 00:00:14,640\nAnd it almost never comes from one big moment. It comes from small habits you repeat every day.\n\n4\n00:00:14,800 --> 00:00:21,960\nHere are eight of them. Number five is sitting on the table in front of you right now.\n\n5\n00:00:22,100 --> 00:00:25,280\nOne. Sorry, for things that aren't your fault.\n\n6\n00:00:25,400 --> 00:00:31,800\nSorry, quick question. Sorry, can I get past. Sorry, to a guy who walked into you.\n\n7\n00:00:31,900 --> 00:00:37,920\nEach one is tiny. Together, they tell the room you think you're in the way.\n\n8\n00:00:38,000 --> 00:00:44,440\nKeep sorry for when you've actually done something. Everywhere else, say thank you or excuse me.\n\n9\n00:00:44,600 --> 00:00:46,160\nTwo. Explaining your no.\n\n10\n00:00:46,300 --> 00:00:53,880\nI can't, because my cousin is in town, and I have this thing, and honestly I've been so tired.\n\n11\n00:00:54,000 --> 00:01:01,600\nEvery reason you give is a door. Now they can argue with the reason instead of accepting the answer.\n\n12\n00:01:01,700 --> 00:01:06,120\nI can't make it. Thanks for asking. That's a full sentence.\n\n13\n00:01:06,200 --> 00:01:08,240\nThree. Being available every time.\n\n14\n00:01:08,400 --> 00:01:15,560\nIn 1975, researchers handed people a cookie from a jar. Some jars had ten cookies. Some had two.\n\n15\n00:01:15,700 --> 00:01:22,080\nSame cookies. The ones from the nearly empty jar were rated as better, and worth more.\n\n16\n00:01:22,200 --> 00:01:29,800\nIf you answer in four seconds, cancel your plans, and say yes to everything, you are the full jar.\n\n17\n00:01:29,900 --> 00:01:36,720\nThis isn't about playing games. It's about actually having a life that some requests don't fit into.\n\n18\n00:01:36,800 --> 00:01:40,040\nFour. Laughing when the joke is on you.\n\n19\n00:01:40,200 --> 00:01:46,560\nSomeone takes a shot at you in front of the group. Everyone laughs. So do you.\n\n20\n00:01:46,700 --> 00:01:50,680\nYour laugh is a signature. It says, this is allowed.\n\n21\n00:01:50,800 --> 00:01:57,600\nYou don't need a comeback. Just don't laugh. Hold their eyes for one second, and move on.\n\n22\n00:01:57,700 --> 00:02:00,120\nFive. The phone on the table.\n\n23\n00:02:00,200 --> 00:02:10,240\nIn 2013, researchers had pairs of strangers talk for ten minutes. For half of them, a phone sat on the table nearby. Nobody touched it.\n\n24\n00:02:10,400 --> 00:02:16,360\nThose pairs felt less close, and trusted each other less. Just from it being there.\n\n25\n00:02:16,500 --> 00:02:24,880\nA phone on the table says, you have me until something better lights up. Put it away. People feel it immediately.\n\n26\n00:02:25,000 --> 00:02:26,600\nSix. Insulting yourself first.\n\n27\n00:02:26,700 --> 00:02:32,720\nI'm terrible at this. Classic me. I'm an idiot. You say it to seem humble.\n\n28\n00:02:32,800 --> 00:02:44,440\nBut people don't have time to study you. They take your word for it. In a 2012 study, groups gave more status to the people who rated themselves highly.\n\n29\n00:02:44,600 --> 00:02:49,360\nYou don't have to brag. Just stop writing the label for them.\n\n30\n00:02:49,500 --> 00:02:51,080\nSeven. Filling every silence.\n\n31\n00:02:51,200 --> 00:02:58,000\nThere's a pause. It lasts two seconds. And you rush in with anything, just to end it.\n\n32\n00:02:58,100 --> 00:03:06,120\nThe person who can't stand a pause always gives away more. In a negotiation. In an argument. On a date.\n\n33\n00:03:06,200 --> 00:03:12,240\nSay your sentence. Then let it sit. The silence isn't empty. It's working for you.\n\n34\n00:03:12,400 --> 00:03:14,760\nEight. Breaking promises nobody else heard.\n\n35\n00:03:14,900 --> 00:03:21,280\nGym tomorrow. Up at six. No more texting her. Nobody knows you said it. Except you.\n\n36\n00:03:21,400 --> 00:03:30,200\nAnd you're the one witness you can't fool. Every broken promise is a vote for the idea that your word means nothing.\n\n37\n00:03:30,300 --> 00:03:38,320\nThat leaks out. In your voice. In how you stand. Other people can hear a man who doesn't believe himself.\n\n38\n00:03:38,400 --> 00:03:41,240\nAll eight come from the same place.\n\n39\n00:03:41,400 --> 00:03:48,160\nEach one is you, treating your own time, your own word and your own presence as cheap.\n\n40\n00:03:48,300 --> 00:03:53,480\nPeople don't decide how to treat you. They copy how you treat yourself.\n\n41\n00:03:53,600 --> 00:04:00,400\nSo don't try to fix all eight. Pick one. Do it for a week. Watch who notices.\n\n42\n00:04:00,500 --> 00:04:04,120\nWhich one is yours? Tell me the number below.\n\n43\n00:04:04,200 --> 00:04:08,640\nAnd next. Seven signs someone is testing how weak you are.\n\n", "scenes": [{"n": 1, "st": 0.0, "f": "H", "sec": "Hook", "vo": "Nobody tells you they've stopped respecting you.", "ar": "البطل وسط مجموعة زملا d been victimized before. Freedman and Fraser (1966) showed that agreeing to a small request makes people far more likely to agree to a much larger one later.\n\n💡 KEY TAKEAWAY:\nA test is a question. You answer it the first time, calmly, or you answer it for years.\n\n📚 RESEARCH MENTIONED:\n• Grayson, B., & Stein, M. I. (1981). Attracting assault: Victims' nonverbal cues. Journal of Communication.\n• Wheeler, S., Book, A., & Costello, K. (2009). Psychopathic traits and perceptions of victim vulnerability. Criminal Justice and Behavior.\n• Freedman, J. L., & Fraser, S. C. (1966). Compliance without pressure: The foot-in-the-door technique. Journal of Personality and Social Psychology.\n• Ford, T. E., & Ferguson, M. A. (2004). Social consequences of disparagement humor. Personality and Social Psychology Review.\n\nThis video is for education and self-reflection. It is not therapy or relationship counseling.\n\n🔔 Subscribe to Unchased for the psychology of men who stopped chasing.\n\n#Psychology #Boundaries #DarkPsychology #MensPsychology #SelfRespect #HumanBehavior #Unchased", "tags": "signs someone is testing you, signs someone is testing how weak you are, people testing your boundaries, how to set boundaries, how to stop being disrespected, dark psychology signs, manipulation tactics, foot in the door technique, stop being a pushover, how to deal with disrespect, male psychology, self respect, psychology explained, unchased", "thumbs": [{"k": "A", "overlay": "THEY'RE TESTING YOU", "accent": "TESTING", "en": "The man stands with a calm alert face and narrowed eyes, while behind him a small cartoon figure with a sly grin pokes his shoulder with one finger.", "ar": "البطل بوجه هادئ متيقظ وخلفه شخص صغير بابتسامة ماكرة ينكز كتفه بإصبع", "prompt": "IMAGE REFERENCES: image 1 = the channel mascot character. YouTube thumbnail, 16:9, flat 2D cartoon illustration with thick clean black outlines and flat solid colors on a pure white background. The man stands with a calm alert yed. And now you know which one you're dealing with. A test is a question. You answer it the first time, calmly. Or you answer it for years. Which of the seven are you dealing with right now? Tell me below. And if you haven't seen it yet, start here. The psychology of men who let her go.", "words": 620, "dur": 253.0399999999999, "srt": "1\n00:00:00,000 --> 00:00:06,800\nIn 1981, two researchers filmed strangers walking down a New York street. Seven seconds each. No sound.\n\n2\n00:00:06,900 --> 00:00:13,720\nThen they took the tapes into a prison, and asked inmates one question. Who would you pick?\n\n3\n00:00:13,800 --> 00:00:17,840\nThey agreed. Fast. The same few people, again and again.\n\n4\n00:00:18,000 --> 00:00:25,960\nPeople who take advantage of others don't pick at random. They read you. And when they can't tell, they test.\n\n5\n00:00:26,100 --> 00:00:33,680\nHere are seven tests. You've passed some. You've failed some. And number six happens at work every single week.\n\n6\n00:00:33,800 --> 00:00:36,600\nOne. The joke that isn't a joke.\n\n7\n00:00:36,700 --> 00:00:43,920\nA small insult, wrapped in a laugh. About your job, your height, your car. In front of people.\n\n8\n00:00:44,000 --> 00:00:50,840\nIf you react, you're sensitive. Relax, I'm kidding. If you laugh, they've learned the price. It's free.\n\n9\n00:00:51,000 --> 00:00:55,760\nWatch what happens next week. The joke comes back. A little sharper.\n\n10\n00:00:55,900 --> 00:00:58,280\nTwo. The small favor that grows.\n\n11\n00:00:58,400 --> 00:01:05,200\nIn 1966, researchers asked homeowners to put a tiny sign in their window. Almost everyone said yes.\n\n12\n00:01:05,300 --> 00:01:17,320\nTwo weeks later, they asked for a huge ugly billboard on the front lawn. The ones who'd said yes to the small sign agreed more than four times as often.\n\n13\n00:01:17,400 --> 00:01:25,840\nCan you cover me for ten minutes. Then an hour. Then every Friday. Each yes makes the next no feel rude.\n\n14\n00:01:26,000 --> 00:01:27,960\nThree. They make you wait.\n\n15\n00:01:28,100 --> 00:01:32,880\nTwenty minutes late. No message. Then they walk in like nothing happened.\n\n16\n00:01:33,000 --> 00:01:39,000\nOnce is traffic. Every time is a message. Your time is the cheap one here.\n\n17\n00:01:39,100 --> 00:01:42,320\nFour. They ask again after you said no.\n\n18\n00:01:42,400 --> 00:01:49,240\nYou said no. They heard you. And they say, come on. Are you sure? Just this once.\n\n19\n00:01:49,400 --> 00:01:56,160\nThat second ask isn't about the favor. It's a measurement. How much pressure does his no hold?\n\n20\n00:01:56,300 --> 00:02:01,480\nIf it folds on the third push, every future no gets three pushes.\n\n21\n00:02:01,600 --> 00:02:03,600\nFive. They talk over you.\n\n22\n00:02:03,700 --> 00:02:09,320\nYou're mid sentence, and they just start. Louder. Like your voice was background noise.\n\n23\n00:02:09,400 --> 00:02:15,040\nAnd then they watch. Does he stop? Does he trail off? Does he apologize?\n\n24\n00:02:15,200 --> 00:02:21,960\nThe men they stop interrupting are the ones who keep the same volume and finish the sentence.\n\n25\n00:02:22,100 --> 00:02:25,280\nSix. They take a little of your credit.\n\n26\n00:02:25,400 --> 00:02:32,200\nYour idea, said back to the room as theirs. Your work, presented with we. Then just I.\n\n27\n00:02:32,300 --> 00:02:38,320\nIt starts small on purpose. Small enough that speaking up would make you look petty.\n\n28\n00:02:38,400 --> 00:02:47,240\nOne sentence fixes it. Right, that's the idea I brought up Tuesday. Here's the next step. Calm. Out loud. On the spot.\n\n29\n00:02:47,400 --> 00:02:50,160\nSeven. They forget what you asked for.\n\n30\n00:02:50,300 --> 00:02:59,080\nYou asked them not to call you that. Not to show up unannounced. Not to bring that up in front of people.\n\n31\n00:02:59,200 --> 00:03:06,000\nAnd they do it again. Oh, sorry, I forgot. Once is forgetting. Three times is a decision.\n\n32\n00:03:06,100 --> 00:03:08,520\nSo what do you actually do?\n\n33\n00:03:08,600 --> 00:03:13,440\nNot anger. Anger tells them the test worked. You're easy to move.\n\n34\n00:03:13,600 --> 00:03:21,560\nEarly. Small. Calm. The first time, not the tenth. That's not funny to me. I said no. Let me finish.\n\n35\n00:03:21,700 --> 00:03:26,480\nNo speech. No explanation. Two seconds, flat voice, then back to normal.\n\n36\n00:03:26,600 --> 00:03:32,200\nMost people stop right there. A test only continues when the answer is unclear.\n\n37\n00:03:32,300 --> 00:03:34,720\nOne honest thing before you go.\n\n38\n00:03:34,800 --> 00:03:41,640\nNot everyone who's late or tells a bad joke is a predator. Most people are just careless.\n\n39\n00:03:41,800 --> 00:03:53,360\nThe answer is the same either way. Careless people adjust and thank you. People who were testing you get annoyed. And now you know which one you're dealing with.\n\n40\n00:03:53,500 --> 00:04:00,680\nA test is a question. You answer it the first time, calmly. Or you answer it for years.\n\n41\n00:04:00,800 --> 00:04:06,000\nWhich of the seven are you dealing with right now? Tell me below.\n\n42\n00:04:06,100 --> 00:04:12,920\nAnd if you haven't seen it yet, start here. The psychology of men who let her go.\n\n", "scenes": [{"n": 1, "st": 0.0, "f": "P", "sec": "Hook", "vo": "In 1981, two researchers filmed strangers walking down a New York street. Seven seconds each. No sound.", "ar": "كاميرا قديمة على حامل موجهة لرصيف مدينة يمشي عليه أشخاص", "p": "An old film camera on a tripod points at a city sidewalk where small cartoon figures walk past. Wide shot. Muted daylight, observing mood. Flat 2D cartoon illustration, thick clean black outlines, flat solid colors, minimal background on warm off white, burnt orange as the only accent color, simple shapes, clean uncluttered composition, all people are simple cartoon figures in the same style.", "a": "Animate this still image with simple motion that fits the scene. An old film camera on const D=JSON.parse(document.getElementById('data').textContent);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mmss=s=>{s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
let V='r',S='pack',F='all',PUB={};
try{PUB=JSON.parse(localStorage.getItem('pub-un')||'{}')}catch(e){PUB={}}
const isPub=id=>!!(PUB[id]&&PUB[id].published);
const fmtDate=ms=>{try{return new Date(ms).toLocaleDateString('ar',{year:'numeric',month:'long',day:'numeric'})}catch(e){return ''}};
function progress(){const n=D.v.filter(v=>isPub(v.id)).length,tot=D.v.length;
  document.getElementById('prog').innerHTML=`<span>نُشر ${n} من ${tot}</span><div class="bar"><span style="width:${Math.round(n/tot*100)}%"></span></div>`}
const SECS=[['pack','التغليف'],['voice','التعليق الصوتي'],['scenes','برومتات المشاهد'],['anim','التحريك'],['srt','الترجمة SRT']];
const pre=t=>`<div class="pb"><pre>${esc(t)}</pre><button class="copy">نسخ</button></div>`;
function chips(){
  document.getElementById('vchips').innerHTML=`<button class="chip" data-v="r" aria-selected="${V==='r'}">الخطة</button><button class="chip" data-v="i" aria-selected="${V==='i'}">الهوية</button>`+
   D.v.map(v=>`<button class="chip" data-v="${v.id}" aria-selected="${V===v.id}">V${v.id} ${esc(v.animal.split('|')[1])}${isPub(v.id)?'<span class="ok">✓</span>':''}</button>`).join('');
}
function research(){
  let h=`<h3>جدول النشر</h3><p class="note">ثلاثة فيديوهات كل أسبوع لمدة أربعة أسابيع. كل موضوع مأخوذ من فيديو حقق أرقامًا عالية عند قناة صغيرة خلال الأشهر الأخيرة حسب vidIQ. الأرقام تدل على أن الموضوع مطلوب، ولا تضمن النتيجة نفسها لقناة جديدة.</p>`;
  for(const w of ['1','2','3','4']){
    const rows=D.r.filter(x=>x.week===w).map(x=>{
      const ev=x.ev.map(e=>`<div class="ltr" style="margin-bottom:4px"><b>${esc(e[2])}</b> views · ${esc(e[3])} subs<br><span style="color:var(--muted)">${esc(e[0])} — ${esc(e[1])}</span></div>`).join('');
      return `<tr><td class="num">V${x.id}${isPub(x.id)?' ✓':''}</td><td class="ltr"><b>${esc(x.topic)}</b></td><td>${ev}</td><td>${esc(x.why)}</td></tr>`}).join('');
    h+=`<h3>الأسبوع ${w}</h3><div class="scroll"><table><thead><tr><th>الفيديو</th><th>الموضوع</th><th>الدليل من vidIQ</th><th>لماذا يضغط المشاهد</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  h+=`<h3>طريقة الإنتاج في Higgsfield</h3><ol class="steps">
  <li>ارفع صورة البطل من تبويب الهوية مرة واحدة واستخدمها مرجعًا في كل مشهد مكتوب عليه <b>فيه البطل</b>.</li>
  <li>المشاهد <b>بدون البطل</b> و<b>شاشة عنوان</b> تُولَّد بلا مرجع. نص شاشة العنوان يُضاف في المونتاج.</li>
  <li>النسبة 16:9. احفظ كل صورة باسم الملف الظاهر فوقها مثل V01_001 ليسهل التركيب.</li>
  <li>تبويب التحريك فيه المشاهد التي تستحق الحركة فقط: أول المشاهد وأول كل قسم.</li>
  <li>المدد محسوبة على 150 كلمة في الدقيقة. راجع الفصول وملف SRT بعد تسجيل الصوت الفعلي.</li></ol>`;
  return h;
}
function identity(){
  return `<h3>هوية القناة</h3><p class="note">اضغط مطولًا على أي صورة لحفظها. الصور هنا بحجم المعاينة، والنسخ الكاملة في حسابك على Higgsfield.</p>
  <div class="idgrid"><figure class="wide"><img src="${IMG.banner}" alt="بانر القناة"><figcaption>البانر</figcaption></figure>
  <figure><img src="${IMG.logo}" alt="الشعار"><figcaption>الشعار</figcaption></figure>
  <figure><img src="${IMG.avatar}" alt="صورة القناة"><figcaption>صورة القناة</figcaption></figure>
  <figure><img src="${IMG.hero}" alt="البطل"><figcaption>البطل: مرجع كل المشاهد</figcaption></figure>
  <figure class="wide"><img src="${IMG.sheet}" alt="ورقة الشخصية"><figcaption>ورقة الشخصية</figcaption></figure></div>
  <h3>الألوان والخط</h3><div class="sw"><span><i style="background:#c8541a"></i>#C8541A برتقالي محروق</span><span><i style="background:#17140f"></i>#17140F أسود</span><span><i style="background:#fbf8f2"></i>#FBF8F2 أبيض دافئ</span><span><i style="background:#2f7d4f"></i>أخضر لمعطف المرأة فقط</span></div>
  <p class="note">خط العناوين على الصور المصغرة: عريض مضغوط بأحرف كبيرة مثل Archivo Narrow Bold أو Anton.</p>
  <h3>اسم القناة والوصف</h3>${pre('Unchased')}${pre('Psychology for men who stopped chasing.\n\nCalm, research-based videos about attraction, respect, boundaries and letting go. No tricks, no games. Just what the studies say and what it means for you.\n\nNew videos three times a week.')}
  <h3>أسلوب الرسم الثابت</h3>${pre('Flat 2D cartoon illustration, thick clean black outlines, flat solid colors, minimal background on warm off white, burnt orange as the only accent color, simple shapes, clean uncluttered composition')}`;
}
function video(v){
  const hero=v.scenes.filter(s=>s.f==='H').length,p=PUB[v.id]||{};
  let h=`<div class="vtitle">${esc(v.titles[0])}</div><div class="meta">V${v.id} · ${v.scenes.length} مشهد (${hero} فيه البطل) · ${v.words} كلمة · حوالي ${mmss(v.dur)}</div>`;
  h+=`<div class="pubrow"><label class="pub${p.published?' on':''}"><input type="checkbox" id="pub-${v.id}" data-pub="${v.id}" ${p.published?'checked':''}>${p.published?'تم النشر':'لم يُنشر بعد'}</label>${p.published&&p.at?`<span class="pubdate">بتاريخ ${fmtDate(p.at)}</span>`:''}</div>`;
  h+=`<div class="tabs">`+SECS.map(([k,n])=>`<button class="tab" data-s="${k}" aria-selected="${S===k}">${n}</button>`).join('')+`</div>`;
  if(S==='pack'){
    h+=`<h3>العناوين</h3><ol class="titles">${v.titles.map(t=>`<li><span class="ltr">${esc(t)}</span><button class="copy" data-txt="${esc(t)}">نسخ</button></li>`).join('')}</ol><p class="note">${esc(v.pick)}</p>`;
    h+=`<h3>الصور المصغرة</h3><p class="note">ثلاث نسخ للاختبار. ابدأ بالنسخة A وبدّلها إذا بقيت نسبة النقر ضعيفة بعد يومين.</p><div class="cards">${v.thumbs.map(t=>`<article class="card"><header><b>${esc(t.k)}</b><span class="ov">${esc(t.overlay)}</span></header>${t.url?`<a class="tlink" href="${esc(t.url)}" target="_blank" rel="noopener">افتح الصورة الجاهزة ↗</a>`:`<div class="wait">لم تُولَّد بعد. استخدم البرومت أدناه مع صورة البطل مرجعًا.</div>`}<p class="ar">${esc(t.ar)}</p>${pre(t.prompt)}</article>`).join('')}</div>`;
    h+=`<h3>الوصف والفصول</h3>${pre(v.desc)}<p class="note">الفصول محسوبة على سرعة تعليق تقديرية. راجعها بعد تسجيل الصوت.</p>`;
    h+=`<h3>التاجز (${v.tags.length} حرف من 500)</h3>${pre(v.tags)}`;
  } else if(S==='voice'){
    h+=`<h3>النص الكامل للتسجيل</h3>${pre(v.vo)}<h3>التعليق لكل مشهد</h3><div class="scroll"><table><thead><tr><th>الملف</th><th>البداية</th><th>القسم</th><th>التعليق</th><th>محتوى الصورة</th></tr></thead><tbody>${v.scenes.map(s=>`<tr><td class="num ltr">V${v.id}_${String(s.n).padStart(3,'0')}</td><td class="num">${mmss(s.st)}</td><td class="ltr" style="color:var(--muted)">${esc(s.sec)}</td><td class="ltr">${esc(s.vo)}</td><td>${esc(s.ar)}</td></tr>`).join('')}</tbody></table></div>`;
  } else if(S==='scenes'){
    h+=`<div class="filters">${[['all','الكل'],['h','فيه البطل'],['p','بدون البطل']].map(([k,n])=>`<button class="tab" data-f="${k}" aria-selected="${F===k}">${n}</button>`).join('')}</div><div class="cards">`;
    h+=v.scenes.filter(s=>F==='all'||(F==='h'?s.f==='H':s.f!=='H')).map(s=>{
      const pill=s.f==='T'?'<span class="pill">شاشة عنوان، بلا مرجع</span>':(s.f==='P'?'<span class="pill">بدون البطل، بلا مرجع</span>':'<span class="pill h">فيه البطل، مع المرجع</span>');
      return `<article class="card"><header><span class="n">V${v.id}_${String(s.n).padStart(3,'0')}</span>${pill}</header><p class="ar">${esc(s.ar)}</p><p class="vo">${esc(s.vo)}</p>${pre(s.p)}</article>`}).join('')+`</div>`;
  } else if(S==='anim'){
    const a=v.scenes.filter(s=>s.a);
    h+=`<p class="note">${a.length} مشاهد متحركة. ولّد الصورة أولًا، ثم ارفعها في أداة التحريك مع البرومت.</p><div class="cards">${a.map(s=>`<article class="card"><header><span class="n">V${v.id}_${String(s.n).padStart(3,'0')}</span></header><p class="ar">${esc(s.ar)}</p>${pre(s.a)}</article>`).join('')}</div>`;
  } else h+=`<p class="note">توقيت تقديري، وكل سطر يطابق مشهدًا. عدّله على الصوت الفعلي بعد التسجيل.</p>${pre(v.srt)}`;
  return h;
}
function render(){chips();progress();
  document.getElementById('main').innerHTML=V==='r'?research():V==='i'?identity():video(D.v.find(x=>x.id===V))}
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.v){V=b.dataset.v;S='pack';F='all';render();window.scrollTo({top:0});return}
  if(b.dataset.s){S=b.dataset.s;render();return}
  if(b.dataset.f){F=b.dataset.f;render();return}
  if(b.classList.contains('copy')){
    const p=b.parentElement.querySelector('pre');
    const txt=b.dataset.txt!==undefined?b.dataset.txt:(p?p.textContent:'');
    const done=()=>{b.textContent='تم النسخ';b.classList.add('ok');setTimeout(()=>{b.textContent='نسخ';b.classList.remove('ok')},1400)};
    const sel=()=>{if(p){const r=document.createRange();r.selectNodeContents(p);const s=getSelection();s.removeAllRanges();s.addRange(r)}};
    if(navigator.clipboard)navigator.clipboard.writeText(txt).then(done,sel);else sel();
  }
});
document.addEventListener('change',e=>{
  const cb=e.target.closest('input[data-pub]'); if(!cb) return;
  PUB[cb.dataset.pub]={published:cb.checked,at:Date.now()};
  try{localStorage.setItem('pub-un',JSON.stringify(PUB))}catch(e){}
  render();
});
render();
</script>

</body></html>
